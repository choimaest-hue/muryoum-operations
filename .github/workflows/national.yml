name: Refresh nationwide official courses
on:
  schedule:
    # Daily metadata check at 10:43 KST; Monday full reconciliation.
    - cron: '43 1 * * *'
    # Library metadata Monday 10:13 KST; first Monday monthly full reconciliation.
    - cron: '13 1 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [national, library]
        default: national
      force:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: muryoum-national-collection
  cancel-in-progress: false
jobs:
  collect:
    if: vars.NATIONAL_COLLECTION_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate complete official sources and publish atomically
        env:
          MURYOUM_ADMIN_TOKEN: ${{ secrets.MURYOUM_ADMIN_TOKEN }}
          MURYOUM_REPORT_DIR: artifacts/national
          MURYOUM_SOURCE_MODE: ${{ github.event.schedule == '13 1 * * 1' && 'library' || inputs.mode || 'national' }}
          MURYOUM_FORCE_FULL: ${{ inputs.force && 'true' || 'false' }}
        run: node scripts/collect-national.mjs
      - name: Retain collection usage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: national-audit
          path: artifacts/national/national-audit.json
          retention-days: 7
          if-no-files-found: ignore
