name: Refresh Muryoum public catalog
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: muryoum-collection
  cancel-in-progress: false
jobs:
  collect:
    if: vars.COLLECTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MURYOUM_ADMIN_TOKEN: ${{ secrets.MURYOUM_ADMIN_TOKEN }}
    steps:
      - name: Refresh bounded source slices
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, re
          token = os.environ['MURYOUM_ADMIN_TOKEN'].strip()
          if not token:
              raise SystemExit('Missing collection credential')
          for attempt in range(100):
              request = urllib.request.Request(
                  'https://muryoum.choimaest.workers.dev/internal/collect',
                  data=b'', method='POST',
                  headers={'Authorization': 'Bearer ' + token,
                           'User-Agent': 'muryoum-operations/1.0 (https://github.com/choimaest-hue/muryoum-operations)',
                           'Accept': 'application/json'})
              for retry in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          result = json.load(response)
                      break
                  except urllib.error.HTTPError as error:
                      code = error.code
                      body = error.read(16384).decode('utf-8', errors='replace')
                      edge_codes = re.findall(r'(?:error code:|Error\s+)(\d{3,5})', body, re.IGNORECASE)
                      print('HTTP diagnostic: status=' + str(code) + '; edge_codes=' + ','.join(edge_codes))
                      if code not in (429, 500, 502, 503, 504) or retry == 2:
                          raise SystemExit(f'Collection HTTP {code}; previous catalog preserved') from None
                  except (urllib.error.URLError, TimeoutError):
                      if retry == 2:
                          raise SystemExit('Collection network failure; previous catalog preserved') from None
                  except Exception as error:
                      # Never emit exception messages: malformed header errors can contain credentials.
                      raise SystemExit('Collection failed: ' + type(error).__name__) from None
                  time.sleep(5 * (retry + 1))
              status = result.get('status')
              if status == 'ok':
                  remaining = result.get('pendingDetails', 0)
                  print(f'Slice {attempt+1}: phase {result.get("phase", "refresh")}')
                  if not remaining and not result.get('more'):
                      break
              elif status != 'already_running':
                  raise SystemExit('Collection not ready or source validation failed')
              time.sleep(1)
          else:
              raise SystemExit('Bounded collection limit reached')
          with urllib.request.urlopen('https://muryoum.choimaest.workers.dev/v1/health', timeout=15) as response:
              health = json.load(response)
          if not health.get('configured') or health.get('stale'):
              raise SystemExit('Catalog freshness verification failed')
          print('Catalog refresh and freshness verification passed')
          PY
