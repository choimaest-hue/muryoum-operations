name: Refresh Muryoum public catalog
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Collect the catalog or read protected run diagnostics
        type: choice
        options: [collect, diagnostics]
        default: collect
      since:
        description: Diagnostics start time in UTC ISO format (last seven days)
        type: string
        required: false
      until:
        description: Diagnostics end time in UTC ISO format (defaults to now)
        type: string
        required: false
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect.yml'
      - 'scripts/**'
      - 'tests/**'
permissions: {}
jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test collection diagnostics and preservation checks
        run: python3 -m unittest discover -s tests -v
  collect:
    needs: regression-tests
    if: >-
      vars.COLLECTION_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode != 'diagnostics'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    concurrency:
      group: muryoum-collection
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Refresh bounded source slices
        env:
          MURYOUM_ADMIN_TOKEN: ${{ secrets.MURYOUM_ADMIN_TOKEN }}
        run: python3 scripts/collect_catalog.py
  diagnostics:
    needs: regression-tests
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.mode == 'diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read protected collection diagnostics
        env:
          MURYOUM_ADMIN_TOKEN: ${{ secrets.MURYOUM_ADMIN_TOKEN }}
          MURYOUM_OPERATION_MODE: diagnostics
          MURYOUM_DIAGNOSTICS_SINCE: ${{ inputs.since }}
          MURYOUM_DIAGNOSTICS_UNTIL: ${{ inputs.until }}
        run: python3 scripts/collect_catalog.py
